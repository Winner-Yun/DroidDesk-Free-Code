[project]
name = "droiddesk"
version = "0.1.0"
description = "Local Android development companion for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pyside6>=6.7",
    "androguard>=4.1",
    "pyaxmlparser>=0.3",
    "asn1crypto>=1.5",
    "cryptography>=42.0",
    "xxhash>=3.4",
    "watchdog>=4.0",
    "send2trash>=1.8",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "regex>=2024.5",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "loguru>=0.7",
    "sqlalchemy>=2.0",
    "pyahocorasick>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "nuitka>=2.2",
]

[project.scripts]
droiddesk = "droiddesk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/droiddesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["droiddesk"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "device: requires a real device or running emulator",
]
addopts = "-m 'not device'"

[tool.coverage.run]
source = ["src/droiddesk"]
omit = ["src/droiddesk/ui/*"]
